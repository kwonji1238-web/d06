<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, sans-serif; background: #e8f1fb; color: #1d2b3a; }
  .card { background: #fff; border-radius: 20px; padding: 32px 40px; text-align: center;
          box-shadow: 0 8px 24px rgba(0,0,0,.1); min-width: 240px; }
  h1 { margin: 0 0 8px; font-size: 1.2rem; }
  .emoji { font-size: 4rem; }
  .temp { font-size: 2.6rem; font-weight: 700; }
  .desc { font-size: 1.2rem; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>📍 서울</h1>
  <div class="emoji" id="emoji">⏳</div>
  <div class="temp" id="temp">--°C</div>
  <div class="desc" id="desc">불러오는 중...</div>
</div>

<script>
  // 🔌 주소: latitude, longitude 숫자를 바꾸면 다른 도시의 날씨가 나온다
  const url = "https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&current=temperature_2m,weather_code&timezone=Asia%2FSeoul";

  const WEATHER = {
    0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
    45: ["안개", "🌫️"], 48: ["서리 안개", "🌫️"],
    51: ["가벼운 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌧️"],
    56: ["얼어붙는 이슬비", "🌧️"], 57: ["강한 얼어붙는 이슬비", "🌧️"],
    61: ["약한 비", "🌧️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
    66: ["얼어붙는 비", "🌧️"], 67: ["강한 얼어붙는 비", "🌧️"],
    71: ["약한 눈", "🌨️"], 73: ["눈", "❄️"], 75: ["강한 눈", "❄️"], 77: ["싸락눈", "❄️"],
    80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["강한 소나기", "⛈️"],
    85: ["약한 눈보라", "🌨️"], 86: ["강한 눈보라", "❄️"],
    95: ["천둥번개", "⛈️"], 96: ["천둥번개와 우박", "⛈️"], 99: ["강한 천둥번개와 우박", "⛈️"]
  };

  fetch(url)
    .then(r => r.json())
    .then(data => {
      const { temperature_2m, weather_code } = data.current;
      const [text, emoji] = WEATHER[weather_code] || ["알 수 없음", "❓"];
      document.getElementById("temp").textContent = temperature_2m + "°C";
      document.getElementById("desc").textContent = text;
      document.getElementById("emoji").textContent = emoji;
    })
    .catch(() => {
      document.getElementById("emoji").textContent = "⚠️";
      document.getElementById("desc").textContent = "날씨를 불러오지 못했어요";
    });
</script>
</body>
</html>
